name: Build SouthWest-NG Kernel

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Select variant to build (Default builds all 6 flavors in parallel)'
        required: true
        type: choice
        default: 'ALL (Build all 6 variants)'
        options:
          - 'ALL (Build all 6 variants)'
          - 'Vanilla'
          - 'Vanilla-UV'
          - 'ReSukiSU'
          - 'ReSukiSU-UV'
          - 'ReSukiSU-SUSFS'
          - 'ReSukiSU-SUSFS-UV'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Vanilla"
            flags: ""
          - name: "Vanilla-UV"
            flags: "--undervolt"
          - name: "ReSukiSU"
            flags: "--resukisu"
          - name: "ReSukiSU-UV"
            flags: "--resukisu --undervolt"
          - name: "ReSukiSU-SUSFS"
            flags: "--resukisu-susfs"
          - name: "ReSukiSU-SUSFS-UV"
            flags: "--resukisu-susfs --undervolt"

    steps:
      - name: Check if variant is selected
        id: filter
        run: |
          CHOICE="${{ inputs.variant }}"
          if [ "$CHOICE" == "ALL (Build all 6 variants)" ] || [ "$CHOICE" == "${{ matrix.name }}" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Run build script
        if: steps.filter.outputs.run == 'true'
        run: |
          chmod +x build.sh
          ./build.sh ${{ matrix.flags }}

      - name: Upload Kernel Zip to Releases
        if: steps.filter.outputs.run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          tag_name: "Build-${{ github.run_number }}"
          name: "SouthWest-NG Lavender - Build ${{ github.run_number }}"
